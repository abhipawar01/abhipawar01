<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 210" width="460" height="210" role="img" aria-label="Animated demo of HookVault: an outlier video badge on a YouTube channel, then saved and repurposed into an X thread">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#06222b"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="460" height="210" rx="18" fill="url(#bg)" stroke="#1f2a3a"/>

  <!-- browser window, gently floating -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <rect x="18" y="16" width="424" height="178" rx="12" fill="#0f1623" stroke="#263247" filter="url(#shadow)"/>
    <path d="M18 28a12 12 0 0 1 12-12h400a12 12 0 0 1 12 12v10H18z" fill="#151e2e"/>
    <circle cx="36" cy="27" r="3.5" fill="#ef4444"/>
    <circle cx="48" cy="27" r="3.5" fill="#f59e0b"/>
    <circle cx="60" cy="27" r="3.5" fill="#22c55e"/>
    <rect x="80" y="21" width="230" height="12" rx="6" fill="#0b1220"/>
    <text x="92" y="30.5" font-family="Consolas,Menlo,monospace" font-size="9" fill="#64748b">youtube.com/@creator/videos</text>

    <!-- chart -->
    <text x="36" y="58" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">Views per video</text>
    <!-- median line -->
    <line x1="36" y1="146" x2="262" y2="146" stroke="#475569" stroke-dasharray="4 4"/>
    <text x="266" y="149" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="9" fill="#64748b">median</text>
    <line x1="36" y1="172" x2="290" y2="172" stroke="#263247"/>

    <!-- bars: baseline y=172 -->
    <g fill="#334155">
      <rect x="44"  width="26" height="0" y="172"><animate attributeName="height" values="0;26;26;0" keyTimes="0;0.1;0.92;1" dur="8s" repeatCount="indefinite"/><animate attributeName="y" values="172;146;146;172" keyTimes="0;0.1;0.92;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="76"  width="26" height="0" y="172"><animate attributeName="height" values="0;32;32;0" keyTimes="0;0.13;0.92;1" dur="8s" repeatCount="indefinite"/><animate attributeName="y" values="172;140;140;172" keyTimes="0;0.13;0.92;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="108" width="26" height="0" y="172"><animate attributeName="height" values="0;20;20;0" keyTimes="0;0.16;0.92;1" dur="8s" repeatCount="indefinite"/><animate attributeName="y" values="172;152;152;172" keyTimes="0;0.16;0.92;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="140" width="26" height="0" y="172"><animate attributeName="height" values="0;30;30;0" keyTimes="0;0.19;0.92;1" dur="8s" repeatCount="indefinite"/><animate attributeName="y" values="172;142;142;172" keyTimes="0;0.19;0.92;1" dur="8s" repeatCount="indefinite"/></rect>
    </g>
    <!-- the outlier -->
    <rect x="172" width="26" height="0" y="172" fill="url(#hot)">
      <animate attributeName="height" values="0;0;104;104;0" keyTimes="0;0.22;0.38;0.92;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="172;172;68;68;172" keyTimes="0;0.22;0.38;0.92;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <g fill="#334155">
      <rect x="204" width="26" height="0" y="172"><animate attributeName="height" values="0;34;34;0" keyTimes="0;0.25;0.92;1" dur="8s" repeatCount="indefinite"/><animate attributeName="y" values="172;138;138;172" keyTimes="0;0.25;0.92;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="236" width="26" height="0" y="172"><animate attributeName="height" values="0;28;28;0" keyTimes="0;0.28;0.92;1" dur="8s" repeatCount="indefinite"/><animate attributeName="y" values="172;144;144;172" keyTimes="0;0.28;0.92;1" dur="8s" repeatCount="indefinite"/></rect>
    </g>

    <!-- outlier badge -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.38;0.42;0.92;1" dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0;0 0" keyTimes="0;0.38;0.44;1" dur="8s" repeatCount="indefinite"/>
      <rect x="156" y="42" width="58" height="20" rx="10" fill="#22d3ee"/>
      <text x="185" y="56" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#06222b">4.2x</text>
    </g>

    <!-- right panel -->
    <g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
      <!-- save button: + Save -> Saved -->
      <rect x="322" y="62" width="104" height="28" rx="8" fill="#0891b2">
        <animate attributeName="fill" values="#0891b2;#0891b2;#16a34a;#16a34a;#0891b2" keyTimes="0;0.5;0.54;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="374" y="80.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">+ Save
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.52;0.92;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="374" y="80.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" opacity="0">Saved &#10003;
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.52;0.54;0.92;1" dur="8s" repeatCount="indefinite"/>
      </text>

      <!-- repurpose result -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.68;0.92;1" dur="8s" repeatCount="indefinite"/>
        <rect x="322" y="100" width="104" height="78" rx="8" fill="#0b1220" stroke="#263247"/>
        <text x="332" y="116" font-size="10" font-weight="700" fill="#22d3ee">X thread</text>
        <rect x="332" y="124" width="84" height="5" rx="2.5" fill="#334155"/>
        <rect x="332" y="135" width="70" height="5" rx="2.5" fill="#334155"/>
        <rect x="332" y="146" width="80" height="5" rx="2.5" fill="#334155"/>
        <rect x="332" y="157" width="52" height="5" rx="2.5" fill="#334155"/>
      </g>
    </g>
  </g>
</svg>
