<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 210" width="460" height="210" role="img" aria-label="Animated demo of Isle: a floating pill showing Claude Code activity and an Allow or Deny permission request">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#06222b"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2433"/>
      <stop offset="1" stop-color="#0d131d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="220%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="460" height="210" rx="18" fill="url(#bg)" stroke="#1f2a3a"/>
  <ellipse cx="230" cy="105" rx="190" ry="70" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- desktop "windows" behind the pill to give depth -->
  <rect x="34" y="22" width="150" height="10" rx="5" fill="#ffffff" opacity="0.05"/>
  <rect x="34" y="40" width="96" height="10" rx="5" fill="#ffffff" opacity="0.04"/>
  <rect x="290" y="22" width="140" height="10" rx="5" fill="#ffffff" opacity="0.05"/>
  <rect x="350" y="40" width="80" height="10" rx="5" fill="#ffffff" opacity="0.04"/>

  <!-- floating pill -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <rect x="20" y="70" width="420" height="64" rx="32" fill="url(#pill)" stroke="#22d3ee" stroke-opacity="0.45" filter="url(#shadow)"/>
    <rect x="21" y="71" width="418" height="30" rx="15" fill="#ffffff" opacity="0.04"/>

    <!-- status dot + pulse -->
    <circle cx="52" cy="102" r="7" fill="#22d3ee">
      <animate attributeName="fill" values="#22d3ee;#22d3ee;#f59e0b;#f59e0b" keyTimes="0;0.66;0.67;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="52" cy="102" r="7" fill="none" stroke="#22d3ee" stroke-width="2">
      <animate attributeName="r" values="7;16" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#22d3ee;#22d3ee;#f59e0b;#f59e0b" keyTimes="0;0.66;0.67;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
    </circle>

    <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#e5e7eb">
      <!-- state 1 -->
      <text x="76" y="107" opacity="0">
        Claude is reading <tspan fill="#22d3ee" font-family="Consolas,Menlo,monospace">src/index.js</tspan>
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.30;0.33;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <!-- state 2 -->
      <text x="76" y="107" opacity="0">
        Running <tspan fill="#22d3ee" font-family="Consolas,Menlo,monospace">npm test</tspan> ...
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.36;0.63;0.66;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <!-- state 3 -->
      <text x="76" y="107" opacity="0">
        Allow <tspan fill="#fbbf24" font-family="Consolas,Menlo,monospace">git push</tspan> ?
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.69;0.97;1" dur="9s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- allow / deny buttons -->
    <g opacity="0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.69;0.97;1" dur="9s" repeatCount="indefinite"/>
      <rect x="276" y="90" width="72" height="26" rx="13" fill="#16a34a">
        <animate attributeName="fill" values="#16a34a;#16a34a;#22c55e;#16a34a" keyTimes="0;0.8;0.86;1" dur="9s" repeatCount="indefinite"/>
      </rect>
      <text x="312" y="108" text-anchor="middle" fill="#fff">Allow</text>
      <rect x="358" y="90" width="66" height="26" rx="13" fill="#1f2937" stroke="#ef4444" stroke-opacity="0.7"/>
      <text x="391" y="108" text-anchor="middle" fill="#fca5a5">Deny</text>
    </g>
  </g>

  <text x="230" y="176" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8">Approve Claude Code without leaving your editor</text>
  <text x="230" y="194" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#64748b">Never auto-approves. No answer in 60s, Claude asks in the terminal.</text>
</svg>
